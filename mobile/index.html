<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="">
  <title>UniChat</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <!-- Écran Chats : historique agrégé, épinglées en tête -->
  <main id="screen-chats" class="screen active">
    <header class="topbar">
      <img class="brand-icon" src="assets/logo.png" alt="">
      <span class="brand">UniChat</span>
    </header>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" type="search" placeholder="Rechercher un chat…" autocomplete="off">
    </div>
    <section id="chat-list" class="scroll-area" aria-label="Conversations"></section>
    <!-- Dock : logos des services actifs, accès direct au chat -->
    <nav id="quick-dock" aria-label="Services actifs"></nav>
  </main>

  <!-- Écran Services : registre, activation, ajout -->
  <main id="screen-services" class="screen">
    <header class="topbar">
      <h1>Services</h1>
      <button id="open-catalog" title="Activer / désactiver des services du catalogue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>
    <section class="scroll-area">
      <button id="add-service" class="add-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Ajouter par URL…
      </button>
      <div id="service-list" aria-label="Services enregistrés"></div>
    </section>
  </main>

  <!-- Écran Réglages -->
  <main id="screen-settings" class="screen">
    <header class="topbar"><h1>Réglages</h1></header>
    <section class="scroll-area">
      <h2 class="settings-h">Thème</h2>
      <div class="theme-row" role="radiogroup">
        <button class="theme-opt" data-theme="system">Système</button>
        <button class="theme-opt" data-theme="light">Clair</button>
        <button class="theme-opt" data-theme="dark">Sombre</button>
      </div>
      <h2 class="settings-h">Registre</h2>
      <button id="export-registry" class="settings-btn">Exporter (JSON)</button>
      <button id="import-registry" class="settings-btn">Importer (JSON)</button>
      <input id="import-file" type="file" accept="application/json" class="hidden">
      <p class="settings-about">
        Historique et registre 100 % locaux. Le titre de la page est le
        titre du chat : aucun sélecteur CSS à maintenir.
      </p>
    </section>
  </main>

  <!-- Vue service : la WebView native (phase 4) vit ici, par-dessus l'UI -->
  <section id="webview-holder" class="hidden">
    <header id="webview-bar" class="topbar">
      <button id="webview-back" title="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <img id="webview-logo" alt="">
      <span id="webview-title"></span>
    </header>
    <div id="webview-slot"></div>
  </section>

  <!-- Navigation basse -->
  <nav id="bottomnav" aria-label="Navigation">
    <button class="nav-btn active" data-screen="chats">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
      <span>Chats</span>
    </button>
    <button class="nav-btn" data-screen="services">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
      <span>Services</span>
    </button>
    <button class="nav-btn" data-screen="settings">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
      <span>Réglages</span>
    </button>
  </nav>

  <!-- Bottom-sheet générique : le catalogue et l'action menu s'y affichent -->
  <div id="sheet-overlay" class="hidden"></div>

  <div id="sheet-catalog" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <h2>Choisir vos services IA</h2>
      <p class="sheet-sub">Un clic active, un second clic désactive (session et historique conservés).</p>
    </div>
    <div id="catalog-list" class="sheet-body"></div>
    <div class="sheet-foot">
      <button id="catalog-add-url" class="ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Ajouter par URL…
      </button>
      <button id="catalog-done" class="primary">Terminé</button>
    </div>
  </div>

  <!-- Modale : toutes les conversations d'un service (« Voir les autres ») -->
  <div id="sheet-chats" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <h2 id="sheet-chats-title"></h2>
      <p class="sheet-sub" id="sheet-chats-count"></p>
    </div>
    <div id="sheet-chats-body" class="sheet-body"></div>
  </div>

  <!-- Wizard : ajout d'un service par URL -->
  <div id="sheet-wizard" class="sheet sheet-full hidden" role="dialog" aria-modal="true">
    <div class="sheet-grab"></div>
    <div class="sheet-head"><h2 id="wizard-title">Ajouter un service</h2></div>
    <div class="sheet-body">
      <div id="wizard-step-url">
        <label for="svc-url">URL du chat IA</label>
        <input id="svc-url" type="url" placeholder="https://chat.example.com" inputmode="url">
      </div>
      <div id="wizard-step-confirm" class="hidden">
        <div class="preview">
          <img id="svc-logo" alt="">
          <span id="svc-name-preview"></span>
        </div>
        <label for="svc-name">Nom</label>
        <input id="svc-name" type="text">
        <label for="svc-accent">Couleur d'accentuation</label>
        <input id="svc-accent" type="color">
        <label for="svc-accent2">Couleur secondaire</label>
        <input id="svc-accent2" type="color">
      </div>
      <p id="wizard-error" class="error hidden"></p>
    </div>
    <div class="sheet-foot">
      <button id="wizard-cancel" class="ghost">Annuler</button>
      <button id="wizard-next" class="primary">Analyser</button>
    </div>
  </div>

  <!-- Action menu (⋮ d'un service ou d'un chat) -->
  <div id="sheet-menu" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-grab"></div>
    <div id="menu-body" class="sheet-body menu-body"></div>
  </div>

  <div id="toast" class="hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
